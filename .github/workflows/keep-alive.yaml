name: Supabase Keep-Alive

on:
  schedule:
    # Cada 5 días a las 12:00 UTC
    - cron: '0 12 */5 * *'
  workflow_dispatch: # Botón manual para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://ioyqlzhzlvkkebvenqnz.supabase.co
          echo " - Supabase keep-alive ping"
